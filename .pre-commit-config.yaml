# Commit gate (CLAUDE.md, "Hooks"): commit-gate, developed and released in github.com/aeftimia/commit-gate, whose README
# lists what it reads and its gaps. Installed once per clone, from the main checkout (CLAUDE.md gives the command).
minimum_pre_commit_version: 4.7.0
default_install_hook_types: [pre-commit, commit-msg]  # pre-push: `commit-gate install-pre-push`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 15 MB: the largest result file tracked on purpose is 11 MB of rows; model files start above this.
      # --enforce-all: a file that grows past the limit is refused too, not only a new one. At a push, withheld-terms-push
      # reads every pushed file's size against the same limit.
      - id: check-added-large-files
        args: [--maxkb=15000, --enforce-all]
        stages: [pre-commit]
  - repo: https://github.com/aeftimia/commit-gate
    rev: 18344fa91b278fac9182607235e3f773a83d468b  # v0.1.1 (a commit SHA, so a moved tag cannot change what runs)
    hooks:
      - id: withheld-terms  # the terms file: .claude/commit-gate-terms.txt in the main checkout, untracked (the default)
      - id: withheld-terms-message
      - id: withheld-terms-push
        args: [--max-kb, "15000"]
      - id: gitleaks  # this project's allowlists: .gitleaks.toml
        args: [--config, .gitleaks.toml]
      - id: gitleaks-message
        args: [--config, .gitleaks.toml]
      - id: gitleaks-push
        args: [--config, .gitleaks.toml]
